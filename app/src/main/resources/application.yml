spring:
  application:
    name: user-management-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:user.exchange}
    queue:
      user-registered: ${RABBITMQ_QUEUE_USER_REGISTERED:user.registered}
      user-deleted: ${RABBITMQ_QUEUE_USER_DELETED:user.deleted}
    routing-key:
      user-registered: ${RABBITMQ_ROUTING_KEY_USER_REGISTERED:user.registered}
      user-deleted: ${RABBITMQ_ROUTING_KEY_USER_DELETED:user.deleted}
