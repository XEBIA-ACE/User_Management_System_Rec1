spring:
  application:
    name: user-management-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

rabbitmq:
  exchange:
    notifications: ${RABBITMQ_EXCHANGE_NOTIFICATIONS:notifications.exchange}
  queue:
    otp: ${RABBITMQ_QUEUE_OTP:otp.queue}
  routing-key:
    otp: ${RABBITMQ_ROUTING_KEY_OTP:otp.send}

logging:
  level:
    com.usermanagement: INFO
    org.springframework.security: WARN
