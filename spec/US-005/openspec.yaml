openspec: '1.0'
story:
  id: US-005
  title: Send OTP to User Email
  description: As a user, I want to receive an OTP via email during registration so
    that I can secure my account activation process.
  feature:
    id: F-01
    title: User Registration
  epic:
    id: EP-002
    title: Account Activation via OTP
  status: draft
functional_requirement:
  description: "## S-001\n\n### Purpose\n\nThis specification defines the functional\
    \ requirements for sending a one-time password (OTP) to a user’s email address\
    \ during registration as part of the account activation process.\n\n### Scope\n\
    \nThis specification covers the process beginning when a user submits a registration\
    \ request with an email address and ending when the system logs the generation\
    \ and attempted delivery of the OTP. It applies only to the User Management Service’s\
    \ handling of email OTP for new registrations.\n\n### Non-Goals\n\n1. Password\
    \ policy enforcement\n2. Management of user login sessions\n3. Resending OTPs\
    \ post initial attempt\n4. Mobile/SMS OTP delivery\n5. User onboarding beyond\
    \ OTP verification\n6. Email content customization or localization\n7. Rate limiting\
    \ or anti-abuse measures\n8. Delivery guarantees for external email failures\n\
    9. Management UI for audits\n10. Registration workflows post-OTP verification\n\
    \n### Key Entities\n\n- **UserRegistration**\n  - email_address: string\n  - registration_id:\
    \ string\n  - status: string (pending, verified, failed)\n- **OTP**\n  - code:\
    \ string\n  - expiration_timestamp: datetime\n  - delivery_channel: string (email)\n\
    \  - status: string (generated, sent, failed)\n  - associated_registration: UserRegistration\
    \ [1:1]\n- **OTPEventLog**\n  - event_id: string\n  - event_type: string (generated,\
    \ sent, failure)\n  - timestamp: datetime\n  - related_registration: UserRegistration\
    \ [1:1]\n\n### Functional Requirements\n\nFR-001: User Management Service SHALL\
    \ generate a one-time password (OTP) when a valid email address is submitted during\
    \ registration.  \nFR-002: User Management Service SHALL send the OTP to the provided\
    \ email address within 2 seconds of OTP generation.  \nFR-003: User Management\
    \ Service SHALL validate that the provided email address is syntactically valid\
    \ before generating OTP.  \nFR-004: User Management Service MUST log each OTP\
    \ generation event for audit purposes, linked to the registration attempt.  \n\
    FR-005: User Management Service MUST log every OTP sending attempt for audit purposes,\
    \ regardless of outcome (success or failure).  \nFR-006: User Management Service\
    \ MUST NOT generate or send OTP if email address is missing or invalid.  \nFR-007:\
    \ User Management Service MUST NOT send more than one OTP per registration email\
    \ until previous OTP expires or process is complete.  \nFR-008: User Management\
    \ Service SHOULD display a user-friendly error message if email sending fails.\
    \  \nFR-009: User Management Service SHALL NOT include the OTP in any logs except\
    \ secure audit logs accessible by privileged admins.\n\n### Assumptions Propagation\n\
    \nA-001: A valid email address is required for OTP delivery. (FR-001, FR-003,\
    \ FR-006)  \nA-002: OTP generation and sending occur synchronously with registration\
    \ attempt. (FR-001, FR-002)  \nA-003: Audit logs are only accessible to privileged\
    \ admins. (FR-009)  \nA-004: The external email service is responsible for actual\
    \ email delivery, not success guarantee. (FR-002, FR-005, FR-008)\n\n### Success\
    \ Criteria\n\nSC-001: OTP sent to user email within 2 seconds for at least 99%\
    \ of successful registration attempts.  \nSC-002: 100% of OTP generation and sending\
    \ attempts are logged with correct registration reference.  \nSC-003: System SHALL\
    \ reject registration attempts with invalid email addresses.\n\n### Priority Levels\n\
    \n- FR-001: P1\n- FR-002: P1\n- FR-003: P2\n- FR-004: P1\n- FR-005: P1\n- FR-006:\
    \ P2\n- FR-007: P2\n- FR-008: P2\n- FR-009: P3\n\n### Edge Cases\n\nEC-001: Given\
    \ a registration attempt, When the provided email is syntactically invalid, Then\
    \ OTP generation and sending SHALL NOT proceed and the user is notified.  \nEC-002:\
    \ Given a successful OTP generation, When the email service is temporarily unavailable,\
    \ Then the system logs the failure and notifies the user of delivery failure.\
    \  \nEC-003: Given a registration attempt, When an OTP has already been sent and\
    \ is unexpired, Then the system SHALL NOT generate or send a new OTP.  \nEC-004:\
    \ Given an OTP is generated, When audit logging fails, Then the registration SHALL\
    \ be marked as failed and no OTP is sent.  \nEC-005: Given all systems are operating\
    \ normally, When a registration is completed and OTP sent, Then all logs SHALL\
    \ reference the same registration ID.\n\n### Independent Testability\n\nPreconditions:\
    \  \n1. The user has not registered before with the email address used.  \n2.\
    \ The email address submitted is syntactically valid.  \n3. The registration endpoint\
    \ is reachable.  \n\nUser Action:  \nThe user submits a registration request with\
    \ a valid email address.\n\nObservable Outcome:  \nAn OTP is delivered to the\
    \ submitted email address within 2 seconds and the audit logs contain entries\
    \ for both OTP generation and sending attempt, both referencing the registration."
  acceptance_criteria:
  - given_when_then: Given a new registration attempt, When the user provides a valid
      email address, Then an OTP is generated and sent to the email within 2 seconds.
  - given_when_then: Given an OTP is generated, When the OTP is sent, Then the system
      logs the OTP generation and sending attempt for audit purposes.
  epic_acceptance_criteria:
  - given_when_then: Given a user registers, when an OTP is generated, then it should
      be sent to the user’s registered email.
  - given_when_then: Given a user receives an OTP, when it is entered in the verification
      page within 5 minutes, then the account should be activated.
  - given_when_then: Given a user enters an expired OTP, then the account should not
      be activated.
technical_design:
  description: "## S-001\n\n**Technical Design Specification – OTP Generation and\
    \ Delivery during Registration**  \n**Service: User Management Service (S-001)**\
    \  \n**Tech Stack: Spring Boot, Spring Security, PostgreSQL, Redis, RabbitMQ**\n\
    \n---\n\n### 1. Contracts & Interfaces\n\n#### 1.1 API Contracts\n\n**Endpoint:**\
    \  \n`POST /api/v1/users/register`  \nRequest Body:\n- `email`: string (required)\n\
    \nResponse:\n- `201 Created` if registration + OTP process started successfully\
    \ (OTP sent or delivery in progress)\n- `400 Bad Request` for missing or syntactically\
    \ invalid email address\n- `409 Conflict` if unexpired OTP already exists for\
    \ registration\n- `500 Internal Server Error` if audit/logging fails or another\
    \ error occurs\n\nResponse Error Body (on failure):\n- `message`: string (user-friendly)\n\
    - `error_code`: string (e.g., `INVALID_EMAIL`, `EMAIL_SEND_FAILED`, `LOGGING_FAILURE`,\
    \ etc.)\n\n#### 1.2 Data Model Changes\n\n**Table:** `user_registration`\n- Columns:\n\
    \  - `registration_id`: UUID (PK)\n  - `email_address`: varchar(255), unique\n\
    \  - `status`: varchar(16) (enum: pending, verified, failed)\n  - `created_at`,\
    \ `updated_at`: TIMESTAMP\n\n**Table:** `otp`\n- Columns:\n  - `otp_id`: UUID\
    \ (PK)\n  - `registration_id`: UUID (FK to user_registration)\n  - `code`: varchar(8)\n\
    \  - `expiration_timestamp`: TIMESTAMP\n  - `delivery_channel`: varchar(8) (always\
    \ 'email')\n  - `status`: varchar(16) (generated, sent, failed)\n  - `created_at`,\
    \ `updated_at`: TIMESTAMP\n- Index: unique on (`registration_id`, `status`) where\
    \ `status`IN ('generated', 'sent') and `expiration_timestamp` > NOW()\n\n**Table:**\
    \ `otp_event_log`\n- Columns:\n  - `event_id`: UUID (PK)\n  - `event_type`: varchar(16)\
    \ (generated, sent, failure)\n  - `timestamp`: TIMESTAMP\n  - `registration_id`:\
    \ UUID (FK to user_registration)\n  - `details`: JSONB (includes masked email\
    \ and, if event_type='generated', encrypted OTP code)\n- Index: `registration_id`\n\
    - NOTE: Only store OTP code in `event_type='generated'` and encrypt at rest\n\n\
    #### 1.3 External Service Integration\n\n- Email delivery via domain-registered\
    \ SMTP or third-party SMTP provider\n- Async event queue (`rabbitmq`) for audit/event\
    \ logs (optional for resilience, see ADR)\n\n---\n\n### 2. Test Strategy\n\n**Frameworks:**\
    \  \n- API: JUnit 5 (`@WebMvcTest`), Spring MockMvc for endpoint tests  \n- Repo/DB:\
    \ Spring Data JPA Test with embedded PostgreSQL  \n- Integration: Testcontainers\
    \ (PostgreSQL, Redis, RabbitMQ)  \n- Mocking/stubbing: Mockito, WireMock (for\
    \ email provider if real upstream used)\n\n**Key Test Cases:**\n- `POST /api/v1/users/register`\
    \ with valid email: Returns 201, OTP record created, audit logs present (FR-001,\
    \ FR-002, FR-004, FR-005)\n- Registration with invalid email syntax: Returns 400,\
    \ no OTP or log records created (FR-003, FR-006)\n- Registration when unexpired\
    \ OTP exists: Returns 409, no new OTP or logs created (FR-007, EC-003)\n- Simulated\
    \ email delivery failure: Returns 500 or 201 with warning, logs failure event\
    \ (FR-005, FR-008, EC-002)\n- Simulated audit-logging failure: Registration marked\
    \ failed, returns 500, no OTP generated or sent (FR-004, EC-004)\n- Assert OTP\
    \ is only present in `otp_event_log` with `event_type='generated'`, not in general\
    \ app/log output (FR-009)\n- Asserts for log referencing correct `registration_id`\
    \ throughout (SC-002, EC-005)\n\n---\n\n### 3. Implementation Approach\n\n####\
    \ 3.1 Core Classes & Methods\n\n- `UserRegistrationController` (REST controller)\n\
    \  - `registerUser(@RequestBody UserRegistrationRequest req)`\n\n- `RegistrationApplicationService`\n\
    \  - `register(String email)`: Orchestrates full registration logic\n    - Validates\
    \ email syntax using RFC 5322-compliant regex (`EmailValidator`)\n    - Checks\
    \ for existing user_registration with same email, status != failed\n    - Looks\
    \ up any non-expired OTP for registration (via OTPRepository with proper index)\n\
    \    - If clear, creates `user_registration` record\n    - Generates OTP (cryptographically\
    \ random 6-8 digit alphanumeric, e.g., using `SecureRandom`)\n    - Begins DB\
    \ transaction:\n      - Persists OTP\n      - Writes to `otp_event_log` (event_type=generated,\
    \ encrypts OTP code)\n    - Commits transaction\n    - Attempts synchronous email\
    \ send (via `EmailDeliveryService.sendOtp(email, code)`)\n      - On success,\
    \ updates OTP.status to `sent`, logs `otp_event_log` (event_type=sent)\n     \
    \ - On failure, updates OTP.status to `failed`, logs `otp_event_log` (event_type=failure),\
    \ returns user-friendly error\n      - All log entries reference the registration\
    \ ID\n\n- `OTPRepository`, `UserRegistrationRepository`, `OtpEventLogRepository`\
    \ (Spring Data JPA)\n\n- `OtpCodeGenerator`: Utility, encapsulates OTP pattern\
    \ and SecureRandom logic\n\n- `EmailDeliveryService`: Abstracted/mocked for tests\n\
    \n- `OtpEncryptor`: Handles strong symmetric encryption of OTP in logs\n\n####\
    \ 3.2 Transaction, Performance, Error Handling\n- Transaction boundary covers\
    \ OTP and"
  affected_services:
  - id: S-001
  api_changes:
  - service: S-001
    endpoint: /api/v1/users/register
    method: POST
    change_type: Modify
  - service: S-001
    endpoint: /api/v1/users/otp/send
    method: POST
    change_type: Add (internal or async handler)
gaps: []
